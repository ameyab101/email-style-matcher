# .github/workflows/ci.yml
name: CI – Email Style Matcher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest               # GitHub runs on Linux – no change needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- macOS‑compatible Python version ----
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'           # matches your local 3.10.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- FastAPI health check ----
      - name: Start FastAPI (background)
        run: |
          uvicorn app:app --port 8000 &
          FASTAPI_PID=$!
          echo "FASTAPI_PID=$FASTAPI_PID" >> $GITHUB_ENV
          sleep 5   # wait for server

      - name: Test /docs endpoint
        run: |
          curl -f http://localhost:8000/docs || exit 1

      # ---- Jupyter notebook execution ----
      - name: Run demo notebook (headless)
        run: |
          pip install nbconvert
          jupyter nbconvert --to notebook --execute demo.ipynb --stdout > /dev/null

      # ---- Clean up ----
      - name: Stop FastAPI
        if: always()
        run: |
          kill $FASTAPI_PID || true

      - name: Success
        run: echo "CI passed – style matcher ready!"
